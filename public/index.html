<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Security Awareness Demo</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="logo">
                🔐
            </div>

            <h1>Security Awareness Demo</h1>

            <p class="subtitle">
                Demonstration of password security characteristics
            </p>

            <form id="demoForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter demo username"
                        autocomplete="off"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter a demo password"
                        autocomplete="off"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="submitButton"
                >
                    Submit Demo
                </button>

            </form>


            <div
                id="result"
                class="result hidden"
            ></div>


            <div class="notice">

                <strong>Security Awareness Demo</strong>

                <p>
                    The actual password is never sent to
                    the server or stored in the database.
                    Only password characteristics are
                    recorded for demonstration purposes.
                </p>

            </div>

        </div>

    </div>


    <script src="insta.js"></script>

</body>

</html>
